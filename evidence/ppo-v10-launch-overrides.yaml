# A bounded experimental recipe, NOT evidence that PPO fits or has run on 32GB.
runner:
  logger:
    log_path: ${oc.env:PI05_RL_ROOT}/logs/ppo_goal_smoke
    project_name: pi05-rl-handson
    experiment_name: ppo_goal_smoke
  max_epochs: 2
  # Each evaluation synchronizes the just-updated policy. For these two epochs,
  # skip the duplicate sync at the second start; sampling still uses fresh weights.
  weight_sync_interval: 2
  save_interval: 1
  val_check_interval: 1

algorithm:
  update_epoch: 1
  gamma: 0.99
  reward_coef: 1.0

env:
  train:
    task_suite_name: libero_goal
    task_id_filter: [0, 7, 8, 9]
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    use_rel_reward: False
    reward_coef: 1.0
    use_step_penalty: True
    step_penalty_coef: 0.001
    auto_reset: True
    ignore_terminations: False
    seed: 42
    video_cfg:
      save_video: True
  eval:
    task_suite_name: libero_goal
    task_id_filter: [0, 7, 8, 9]
    total_num_envs: 1
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    use_rel_reward: False
    reward_coef: 1.0
    use_step_penalty: True
    step_penalty_coef: 0.001
    ignore_terminations: False
    seed: 43

rollout:
  unnorm_key: libero_goal
  enable_offload: True
  model:
    model_path: ${actor.model.model_path}
    # Rollout has no FSDP wrapper to cast FP32 storage before BF16 attention.
    precision: bf16

actor:
  micro_batch_size: 1
  # 300 controls / 10 controls per chunk = 30 rollout samples; 2 divides 30.
  global_batch_size: 2
  enable_offload: True
  fsdp_config:
    # Single-rank LoRA resume: retain the verified frozen base separately.
    checkpoint_format: adapter
    checkpoint_base_sha256: 4526e30c6aa11108a3331f7f4ae7931394629961df42736deedd7169ec154d5f
    save_full_model_weights: False
    use_orig_params: True
    # Upstream Pi05 FSDP recipe: retain FP32 numerical islands around BF16 blocks.
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      # PEFT casts to stored FP32 before calling auto-wrapped BF16 LoRA leaves.
      # Each child boundary must recast its inputs to its computation dtype.
      cast_forward_inputs: True
      cast_root_forward_inputs: False
    wrappers:
      projections:
        wrap_names: [action_in_proj, action_out_proj, time_mlp_in, time_mlp_out, value_head]
      norms:
        module_classes: [RMSNorm]
      vision_embedding:
        module_names: [img, img.stem]
      vision_mlps:
        module_names: ["img.encoder.layers.*.mlp"]
        wrap_mode: subtree
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: True
      fp32_preserve_inputs:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: False
    mixed_precision_rules:
      projections: fp32
      norms: fp32_preserve_inputs
      vision_embedding: fp32_preserve_inputs
      vision_mlps: fp32
    amp_autocast:
      enabled: False
  model:
    model_path: ${oc.env:PI05_RL_ROOT}/models/pi05-multitask40-sft-merged
    precision: fp32
    is_lora: True
    lora_rank: 8
    # Native Gemma q_proj/k_proj are ModuleList containers: use actual Linear leaves.
    # LoRA injection follows base freezing; all injected adapters can get gradients.
    lora_target_scope: all_linear
    openpi:
      embed_dtype: bf16
      value_after_vlm: True
      torch_compile: False
      action_horizon: 10
      discrete_state_input: False
      train_expert_only: True
    openpi_data:
      norm_stats_path: ${actor.model.model_path}/assets/physical-intelligence/libero/norm_stats.json
  optim:
    total_training_steps: 30
